[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hevy2garmin"
version = "0.12.0"
description = "Sync Hevy gym workouts to Garmin Connect — exercise mapping, FIT file generation, and automatic upload"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Konstantinos Georgiou", email = "delfinas7kostas@gmail.com" }]
keywords = ["hevy", "garmin", "fitness", "workout", "sync", "fit-file", "strength-training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "garmin-auth>=0.3.0,<0.4.0",
    "garminconnect>=0.3.0,<0.4.0",
    "curl_cffi>=0.6",
    "ua-generator>=1.0",
    "requests>=2.31",
    "fit-tool>=0.9.15",
    "pynacl>=1.5",
    # Postgres/Neon driver. Kept in base (not just the [cloud] extra) because the
    # Vercel one-click deploy — the primary hosted path — installs the pyproject
    # base dependencies, not the [cloud] extra, so a cloud deploy needs it here or
    # it fails at runtime with "No module named 'psycopg2'" (#357).
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "httpx>=0.27",
       "garmin-fit-sdk>=21.0"]  # FIT ground truth for tests/test_real_workout_fixtures.py
cloud = ["psycopg2-binary>=2.9", "pynacl>=1.5"]
audit = ["garmin-fit-sdk>=21.0"]  # ground truth for scripts/audit_mappings.py --regenerate-catalog

[project.scripts]
hevy2garmin = "hevy2garmin.cli:main"

[project.urls]
Homepage = "https://github.com/drkostas/hevy2garmin"
Repository = "https://github.com/drkostas/hevy2garmin"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy2garmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Pinned in CI to the same version (.github/workflows/ci.yml); a moving ruff moves the rules.
target-version = "py310"
line-length = 100
extend-exclude = ["web", "typescript", "universal", "docs"]

[tool.ruff.lint]
# The rules still failing when ruff arrived (#553). Each group is removed here by the PR that
# fixes it; nothing new may join the list. Counts at 0.16.7 after `ruff format` and the safe fixes.
ignore = [
  "RUF059",  # 34 unused unpacked variables (variables PR)
  "F841",    # 4 unused variables (variables PR)
  "RUF012",  # 5 mutable class defaults (variables PR)
  "SIM117",  # 11 nested with statements (structure PR)
  "SIM102",  # 1 collapsible if (structure PR)
  "EXE001",  # 3 shebang on a non-executable file (structure PR)
  "DTZ011",  # 1 date.today() without tz (structure PR)
  "PLW1510", # 1 subprocess.run without check (structure PR)
]
